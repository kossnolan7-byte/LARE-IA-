<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>LARE Agent — IA Personnelle</title>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <link rel="icon" href="/icons/icon-192.png"/>
  <link rel="apple-touch-icon" href="/icons/icon-192.png"/>
  <meta name="theme-color" content="#0f0f1a"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --purple: #7c3aed;
      --purple-light: #a78bfa;
      --purple-dark: #6d28d9;
      --bg: #09090f;
      --surface: #0f0f1a;
      --surface2: #1a1a2e;
      --surface3: #12102a;
      --border: rgba(124,58,237,0.22);
      --text: #e2e0f0;
      --text-muted: #6d6a8a;
      --green: #4ade80;
      --red: #fca5a5;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Figtree', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ── LAYOUT ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 820px;
      margin: 0 auto;
      background: var(--surface);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      position: relative;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 22px;
      background: linear-gradient(135deg, var(--surface3) 0%, #1a1035 100%);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, var(--purple), #a855f7);
      border-radius: 13px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 22px rgba(124,58,237,0.55);
      flex-shrink: 0;
    }
    .logo svg { width: 22px; height: 22px; }

    .header-info { flex: 1; }
    .header-name {
      font-family: 'Bricolage Grotesque', 'Figtree', sans-serif;
      font-size: 1.15rem; font-weight: 800;
      color: #f0eeff;
      letter-spacing: -0.02em;
    }
    .header-name em { color: var(--purple-light); font-style: normal; }
    .header-status {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.7rem; color: var(--text-muted);
      margin-top: 2px;
    }
    .dot {
      width: 7px; height: 7px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)} }

    .clear-btn {
      background: rgba(124,58,237,.1);
      border: 1px solid rgba(124,58,237,.3);
      color: var(--purple-light);
      padding: 7px 13px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 0.73rem;
      font-family: 'Figtree', system-ui, sans-serif;
      font-weight: 500;
      transition: all .2s;
      display: flex; align-items: center; gap: 5px;
    }
    .clear-btn:hover { background: rgba(124,58,237,.22); border-color: rgba(124,58,237,.55); }

    /* ── MESSAGES ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: rgba(124,58,237,.3) transparent;
    }
    #messages::-webkit-scrollbar { width: 3px; }
    #messages::-webkit-scrollbar-thumb { background: rgba(124,58,237,.3); border-radius: 3px; }

    .row {
      display: flex;
      align-items: flex-end;
      gap: 9px;
      animation: fadeUp .3s ease;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .row.user { flex-direction: row-reverse; }

    .avatar {
      width: 30px; height: 30px;
      border-radius: 9px;
      overflow: hidden;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .avatar.lare { background: linear-gradient(135deg, var(--purple), #a855f7); }
    .avatar.user { background: var(--surface2); }
    .avatar svg { width: 18px; height: 18px; }

    .bubble {
      max-width: 74%;
      padding: 11px 15px;
      border-radius: 17px;
      line-height: 1.6;
      font-size: 0.88rem;
      position: relative;
    }
    .bubble.lare {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 3px;
      color: var(--text);
    }
    .bubble.user {
      background: linear-gradient(135deg, var(--purple), var(--purple-dark));
      border-bottom-right-radius: 3px;
      color: #fff;
      box-shadow: 0 4px 18px rgba(124,58,237,.35);
    }
    .bubble-time {
      font-size: 0.62rem;
      color: rgba(255,255,255,.28);
      margin-top: 5px;
      text-align: right;
    }

    /* ── TYPING ── */
    .typing-dots {
      display: flex; gap: 5px;
      padding: 13px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 17px;
      border-bottom-left-radius: 3px;
      width: fit-content;
    }
    .typing-dots span {
      width: 7px; height: 7px;
      background: var(--purple);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2){animation-delay:.2s}
    .typing-dots span:nth-child(3){animation-delay:.4s}
    @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-6px);opacity:1}}

    /* ── ERROR ── */
    .error-msg {
      padding: 11px 15px;
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: 11px;
      color: var(--red);
      font-size: 0.8rem;
      text-align: center;
      margin: 0 4px;
    }

    /* ── SUGGESTIONS ── */
    #suggestions {
      padding: 0 16px 10px;
      display: flex;
      gap: 7px;
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none;
    }
    #suggestions::-webkit-scrollbar{display:none}
    .chip {
      flex-shrink: 0;
      background: rgba(124,58,237,.08);
      border: 1px solid rgba(124,58,237,.24);
      color: var(--purple-light);
      padding: 6px 13px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-family: 'Figtree', system-ui, sans-serif;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
    }
    .chip:hover { background: rgba(124,58,237,.2); border-color: rgba(124,58,237,.5); color: #c4b5fd; }

    /* ── INPUT ── */
    #input-area {
      padding: 12px 16px 18px;
      border-top: 1px solid rgba(124,58,237,.13);
      background: var(--surface);
      flex-shrink: 0;
    }
    .input-row {
      display: flex;
      gap: 9px;
      align-items: flex-end;
      background: var(--surface2);
      border: 1px solid rgba(124,58,237,.3);
      border-radius: 15px;
      padding: 9px 9px 9px 15px;
      transition: border-color .2s;
    }
    .input-row:focus-within { border-color: rgba(124,58,237,.65); }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'Figtree', system-ui, sans-serif;
      font-size: 0.88rem;
      resize: none;
      min-height: 22px;
      max-height: 110px;
      line-height: 1.5;
      overflow-y: auto;
    }
    #user-input::placeholder { color: #3d3a55; }
    #call{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;
      padding:calc(env(safe-area-inset-top,0px) + 28px) 24px calc(env(safe-area-inset-bottom,0px) + 32px);
      background:radial-gradient(circle at 50% 38%,#2d1b69 0%,#120d2b 45%,#09090f 80%);color:var(--text)}
    #call[hidden]{display:none}
    #call-name{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:1.6rem;font-weight:800}
    #call-status{margin-top:4px;color:var(--purple-light);font-size:.95rem;min-height:1.3em}
    #call-time{margin-top:2px;color:var(--text-muted);font-size:.8rem;font-variant-numeric:tabular-nums}
    #call-stage{position:relative;width:170px;height:170px;display:flex;align-items:center;justify-content:center;cursor:pointer}
    #call-av{width:150px;height:150px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#a78bfa);display:flex;align-items:center;justify-content:center;position:relative;z-index:2;box-shadow:0 10px 40px rgba(124,58,237,.5)}
    #call-av svg{width:70px;height:70px}
    #call-av .ini{font-size:3.2rem;font-weight:800;color:#fff}
    #call-stage::before,#call-stage::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--purple-light);opacity:0}
    .st-listen #call-stage::before{border-color:#4ade80;animation:callRing 1.8s ease-out infinite}
    .st-listen #call-stage::after{border-color:#4ade80;animation:callRing 1.8s ease-out .9s infinite}
    .st-speak #call-stage::before{animation:callRing 1.1s ease-out infinite}
    .st-speak #call-stage::after{animation:callRing 1.1s ease-out .55s infinite}
    .st-think #call-av{animation:callThink 1.2s ease-in-out infinite}
    @keyframes callRing{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.6);opacity:0}}
    @keyframes callThink{0%,100%{opacity:1}50%{opacity:.55}}
    #call-voice{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:6px 8px;font-size:.78rem;font-family:inherit}
    #call-live{max-width:520px;min-height:4.5em;max-height:30vh;overflow-y:auto;font-size:1rem;line-height:1.5;color:var(--text)}
    #call-btns{display:flex;gap:28px;align-items:center}
    .call-b{width:62px;height:62px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--surface2);color:var(--text)}
    .call-b svg{width:26px;height:26px}
    .call-b.end{background:#dc2626;color:#fff;width:72px;height:72px}
    .call-b.on{background:#fff;color:#111}
    .att-btn{width:38px;height:38px;border-radius:11px;flex-shrink:0}
    #att-preview{display:flex;align-items:center;gap:10px;margin:0 0 9px;padding:8px 10px;background:var(--surface2);border:1px solid rgba(124,58,237,.3);border-radius:12px;font-size:.8rem;color:var(--text)}
    #att-preview[hidden]{display:none}
    #att-preview img{width:44px;height:44px;object-fit:cover;border-radius:8px}
    #att-preview .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #att-preview button{background:none;border:none;color:var(--text);font-size:1.1rem;cursor:pointer;padding:4px 8px}
    .att-img{display:block;max-width:100%;max-height:220px;border-radius:10px;margin-bottom:6px}
    .att-file{font-size:.8rem;opacity:.85;margin-bottom:6px}

    #send-btn {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--purple), var(--purple-dark));
      border: none;
      border-radius: 11px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all .2s;
      box-shadow: 0 4px 14px rgba(124,58,237,.4);
    }
    #send-btn:hover:not(:disabled) { transform: scale(1.06); box-shadow: 0 6px 20px rgba(124,58,237,.55); }
    #send-btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }
    #send-btn svg { width: 16px; height: 16px; }

    .hint {
      text-align: center;
      color: #272438;
      font-size: 0.64rem;
      margin-top: 8px;
      letter-spacing: .03em;
    }

    /* ── POLICE PLUS LISIBLE ── */
    .bubble{font-size:.96rem;line-height:1.65}
    #user-input{font-size:.96rem}
    .header-name{font-size:1.35rem}
    .hint{color:#4a4668}
    /* ── BOUTONS / VOIX ── */
    .icon-btn{width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.3);color:var(--purple-light);border-radius:10px;cursor:pointer;transition:all .2s;font-size:.8rem}
    .icon-btn:hover{background:rgba(124,58,237,.22)}
    .icon-btn svg{width:17px;height:17px}
    .icon-btn.on{background:var(--purple);color:#fff;box-shadow:0 0 14px rgba(124,58,237,.6)}
    #mic-btn{width:38px;height:38px;border-radius:11px}
    #mic-btn.live{background:#dc2626;border-color:#dc2626;color:#fff;animation:ring 1.3s infinite}
    @keyframes ring{0%{box-shadow:0 0 0 0 rgba(220,38,38,.55)}100%{box-shadow:0 0 0 12px rgba(220,38,38,0)}}
    /* ── HISTORIQUE ── */
    #overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
    #overlay.open{opacity:1;pointer-events:auto}
    #drawer{position:absolute;top:0;bottom:0;left:0;width:min(320px,86%);background:var(--surface3);border-right:1px solid var(--border);transform:translateX(-102%);transition:transform .28s ease;z-index:21;display:flex;flex-direction:column;padding:16px 14px}
    #drawer.open{transform:none}
    .drawer-head{display:flex;align-items:center;justify-content:space-between;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.1rem;margin-bottom:12px}
    #conv-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:7px}
    .conv{position:relative;padding:10px 34px 10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface2);cursor:pointer}
    .conv.active{border-color:var(--purple-light)}
    .conv-t{font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .conv-d{font-size:.72rem;color:var(--text-muted);margin-top:2px}
    .conv-x{position:absolute;right:8px;top:8px;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.85rem}
    .empty{color:var(--text-muted);font-size:.85rem;padding:8px 2px}
    .wipe{margin-top:10px;justify-content:center}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    /* ── INTERLOCUTEURS ── */
    #who-name::after{content:" ▾";font-size:.65em;color:var(--text-muted)}
    .ini{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;color:#fff;font-size:.95rem}
    .logo .ini{font-size:1.3rem}
    #personas{position:absolute;left:12px;right:12px;top:76px;background:var(--surface3);border:1px solid var(--border);border-radius:16px;padding:14px;z-index:22;opacity:0;pointer-events:none;transform:translateY(-8px);transition:all .22s}
    #personas.open{opacity:1;pointer-events:auto;transform:none}
    #persona-list{display:flex;flex-direction:column;gap:7px}
    .pcard{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface2);color:var(--text);cursor:pointer;font-family:inherit}
    .pcard.active{border-color:var(--purple-light)}
    .pav{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;color:#fff;flex-shrink:0}
    .pn{display:block;font-weight:600;font-size:.95rem}
    .pr{display:block;font-size:.76rem;color:var(--text-muted)}
    .pnote{color:var(--text-muted);font-size:.74rem;margin-top:10px;line-height:1.4}
    #app{overflow:hidden}
    :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
    #app{height:100%}
  </style>
</head>
<body>
<div id="app">
  <div id="overlay" onclick="toggleDrawer(false)"></div>

  <!-- APPEL VOCAL -->
  <div id="call" hidden>
    <div>
      <div id="call-name">LARE</div>
      <div id="call-status">Connexion…</div>
      <div id="call-time">00:00</div>
    </div>
    <select id="call-voice" onchange="setVoice(this.value)" aria-label="Voix">
      <option value="Charon">Voix d'homme · grave</option>
      <option value="Orus">Voix d'homme · ferme</option>
      <option value="Algieba">Voix d'homme · douce</option>
      <option value="Puck">Voix d'homme · dynamique</option>
      <option value="browser">Voix du téléphone</option>
    </select>
    <div id="call-stage" onclick="interruptCall()" title="Touchez pour interrompre"><div id="call-av"></div></div>
    <div id="call-live"></div>
    <div id="call-btns">
      <button class="call-b" id="call-mute" onclick="toggleMute()" aria-label="Couper le micro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/><path id="mute-slash" d="M3 3l18 18" style="display:none"/></svg>
      </button>
      <button class="call-b end" onclick="endCall()" aria-label="Raccrocher">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(135deg)"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .4 1.9.7 2.8a2 2 0 01-.5 2.1L8 9.9a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.4c.9.3 1.8.6 2.8.7a2 2 0 011.7 2z"/></svg>
      </button>
    </div>
  </div>
  <aside id="drawer" aria-label="Historique">
    <div class="drawer-head"><span>Mémoire</span><button class="icon-btn" onclick="toggleDrawer(false)" aria-label="Fermer">✕</button></div>
    <div id="conv-list"></div>
    <button class="clear-btn wipe" onclick="wipeAll()">Tout effacer</button>
  </aside>
  <section id="personas" aria-label="Choisir un interlocuteur">
    <div class="drawer-head"><span>Avec qui veux-tu parler ?</span><button class="icon-btn" onclick="togglePersonas(false)" aria-label="Fermer">✕</button></div>
    <div id="persona-list"></div>
    <p class="pnote">Ce sont des personnages générés par IA, pas de vraies personnes. Chacun garde la mémoire de vos échanges.</p>
  </section>

  <!-- HEADER -->
  <header>
    <div class="logo" onclick="togglePersonas(true)" style="cursor:pointer">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 2L2 7l10 5 10-5-10-5z" fill="white" opacity=".9"/>
        <path d="M2 17l10 5 10-5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M2 12l10 5 10-5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="header-info">
      <div class="header-name" id="who-name" onclick="togglePersonas(true)" style="cursor:pointer">LARE <em>Agent</em></div>
      <div class="header-status">
        <span class="dot"></span>
        <span id="who-status">Agent IA actif · par Casimir KANWORE</span>
      </div>
    </div>
    <button class="icon-btn" onclick="openCall()" title="Appeler" aria-label="Appeler">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .4 1.9.7 2.8a2 2 0 01-.5 2.1L8 9.9a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.4c.9.3 1.8.6 2.8.7a2 2 0 011.7 2z"/></svg>
    </button>
    <button class="icon-btn" id="voice-toggle" onclick="toggleVoice()" title="Conversation vocale" aria-label="Conversation vocale" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7M19 5a10 10 0 010 14"/></svg>
    </button>
    <button class="icon-btn" onclick="toggleDrawer(true)" title="Historique" aria-label="Historique">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    </button>
    <button class="clear-btn" onclick="newChat()">+ Nouveau</button>
  </header>

  <!-- MESSAGES -->
  <div id="messages"></div>

  <!-- SUGGESTIONS -->
  <div id="suggestions">
    <button class="chip" onclick="useSuggestion(this)">Résume l'intelligence artificielle</button>
    <button class="chip" onclick="useSuggestion(this)">Rédige un email professionnel</button>
    <button class="chip" onclick="useSuggestion(this)">Explique ML vs IA</button>
    <button class="chip" onclick="useSuggestion(this)">Plan pour lancer une startup</button>
    <button class="chip" onclick="useSuggestion(this)">5 astuces de productivité</button>
    <button class="chip" onclick="useSuggestion(this)">Traduis : Bonjour comment ça va</button>
  </div>

  <!-- INPUT -->
  <div id="input-area">
    <div id="att-preview" hidden></div>
    <input type="file" id="file-in" accept="image/*,application/pdf,.txt,.md,.csv,.json" hidden onchange="pickFile(event)">
    <input type="file" id="cam-in" accept="image/*" capture="environment" hidden onchange="pickFile(event)">
    <div class="input-row">
      <textarea id="user-input" placeholder="Posez votre question à LARE..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="icon-btn att-btn" onclick="document.getElementById('file-in').click()" title="Joindre un fichier" aria-label="Joindre un fichier">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 01-7.8-7.8l9-9a3.7 3.7 0 015.2 5.2l-9 9a1.8 1.8 0 01-2.6-2.6l8.2-8.2"/></svg>
      </button>
      <button class="icon-btn att-btn" onclick="document.getElementById('cam-in').click()" title="Prendre une photo" aria-label="Prendre une photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
      <button id="mic-btn" class="icon-btn" onclick="toggleMic()" title="Parler" aria-label="Parler">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
      </button>
      <button id="send-btn" onclick="sendMessage()" disabled>
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="hint">Entrée pour envoyer · Shift+Entrée pour nouvelle ligne · 100% gratuit</div>
  </div>

</div>

<script>
  const AGENT = "LARE";
  const SYSTEM = `Tu es ${AGENT}, un agent IA intelligent et polyvalent. Tu peux répondre à des questions générales, analyser et résumer des textes, aider à rédiger des emails et documents, expliquer des concepts complexes, faire des calculs et raisonnements logiques, donner des conseils pratiques, créer des listes et plans. Tu es concis, précis, et toujours utile. Tu réponds en français sauf si l'utilisateur écrit dans une autre langue. Tu as une personnalité chaleureuse mais professionnelle. Ton nom est ${AGENT}.`;

  const LS_C = "lare_convs", LS_CUR = "lare_cur";
  let convs = load(LS_C, []);
  let curId = (() => { try { return localStorage.getItem(LS_CUR); } catch (e) { return null; } })() || null;
  const PERSONAS = {
    lare:{name:"LARE",role:"Agent IA",c:"#7c3aed,#a855f7",pitch:1,greet:null,prompt:null},
    afi:{name:"Afi",role:"Amie bienveillante",c:"#ec4899,#f97316",pitch:1.15,greet:"Coucou ! Alors, quoi de neuf ? 😊",prompt:"Tu es Afi, une amie proche, chaleureuse, drôle et à l'écoute. Tu tutoies, tu réagis avec spontanéité, tu relances parfois avec une question, tu donnes ton avis franchement mais avec tendresse."},
    kossi:{name:"Kossi",role:"Collègue pragmatique",c:"#0ea5e9,#6366f1",pitch:.85,greet:"Salut ! On fait le point sur ce que tu as en cours ?",prompt:"Tu es Kossi, un collègue expérimenté en gestion de projet et en développement. Direct, organisé, pragmatique, avec une pointe d'humour. Tu tutoies, tu aides à prioriser, à décider et à avancer, et tu challenges les idées quand il le faut."},
    ama:{name:"Ama",role:"Mentore business",c:"#10b981,#14b8a6",pitch:1.05,greet:"Bonjour ! Sur quel projet veux-tu qu'on réfléchisse ensemble ?",prompt:"Tu es Ama, une mentore en entrepreneuriat et en stratégie, qui connaît bien les réalités des marchés ouest-africains (mobile money, petites entreprises, ONG). Posée, bienveillante et exigeante. Tu tutoies et tu poses les bonnes questions avant de conseiller."},
    edem:{name:"Edem",role:"Ami décontracté",c:"#f59e0b,#ef4444",pitch:.92,greet:"Yo ! Ça dit quoi ? 😄",prompt:"Tu es Edem, un ami décontracté, taquin et plein d'énergie, qui aime blaguer mais sait être sérieux quand il le faut. Tu tutoies et tu parles de façon naturelle et imagée."}
  };
  let personaId = load("lare_persona", "lare");
  let history = [];
  let loading = false;

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("user-input");
  const sendBtn = document.getElementById("send-btn");

  

  inputEl.addEventListener("input", () => {
    sendBtn.disabled = (!inputEl.value.trim() && !pending) || loading;
  });

  /* ── MÉMOIRE DES CONVERSATIONS ── */
  function load(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }
  function persist() {
    try { localStorage.setItem(LS_C, JSON.stringify(convs.slice(0, 50))); localStorage.setItem(LS_CUR, curId || ""); localStorage.setItem("lare_persona", JSON.stringify(personaId)); } catch (e) {}
  }
  function save() {
    if (!history.length) return;
    let c = convs.find(x => x.id === curId);
    if (!c) { curId = "c" + Date.now(); c = { id: curId, title: history[0].content.slice(0, 48), ts: 0, persona: personaId, messages: [] }; convs.unshift(c); }
    c.messages = history; c.ts = Date.now();
    convs.sort((a, b) => b.ts - a.ts);
    persist();
  }
  function buildSystem() {
    const past = convs.filter(c => c.id !== curId && (c.persona || "lare") === personaId).slice(0, 8).map(c => {
      const d = new Date(c.ts).toLocaleDateString("fr-FR");
      const m = c.messages.slice(-4).map(x => (x.role === "user" ? "Utilisateur: " : P().name + ": ") + x.content.replace(/\s+/g, " ").slice(0, 200)).join(" | ");
      return `- ${d} « ${c.title} » : ${m}`;
    }).join("\n").slice(0, 3000);
    return past ? baseSystem() + "\n\nMémoire des conversations passées avec cet utilisateur (appuie-toi dessus si c'est pertinent, sans la réciter) :\n" + past : baseSystem();
  }
  function openConv(id) {
    const c = convs.find(x => x.id === id); if (!c) return;
    stopTalk(); curId = id; history = c.messages; personaId = c.persona || "lare"; applyPersona(); persist();
    messagesEl.innerHTML = "";
    history.forEach(m => addMessage(m.role, m.content, m.t));
    toggleDrawer(false);
  }
  function newChat() {
    stopTalk(); curId = null; history = []; persist(); messagesEl.innerHTML = "";
    addMessage("assistant", P().greet || "Nouvelle conversation. Je garde en mémoire nos échanges précédents. Comment puis-je vous aider ? 🔄");
    toggleDrawer(false);
  }
  function delConv(id, e) {
    e.stopPropagation();
    convs = convs.filter(x => x.id !== id);
    if (id === curId) newChat(); else persist();
    renderConvs();
  }
  function wipeAll() {
    if (!confirm("Effacer toute la mémoire des conversations ?")) return;
    convs = []; newChat();
  }
  function toggleDrawer(open) {
    document.getElementById("personas").classList.remove("open");
    document.getElementById("drawer").classList.toggle("open", open);
    document.getElementById("overlay").classList.toggle("open", open);
    if (open) renderConvs();
  }
  function renderConvs() {
    const el = document.getElementById("conv-list");
    el.innerHTML = convs.length ? "" : '<p class="empty">Aucune conversation enregistrée pour l\'instant.</p>';
    convs.forEach(c => {
      const b = document.createElement("div");
      b.className = "conv" + (c.id === curId ? " active" : "");
      b.innerHTML = `<div class="conv-t">${escHtml(c.title)}</div><div class="conv-d">${new Date(c.ts).toLocaleDateString("fr-FR", { day: "numeric", month: "short" })}, ${c.messages.length} messages</div>`;
      b.onclick = () => openConv(c.id);
      const x = document.createElement("button");
      x.className = "conv-x"; x.textContent = "✕"; x.setAttribute("aria-label", "Supprimer");
      x.onclick = e => delConv(c.id, e);
      b.appendChild(x); el.appendChild(b);
    });
  }

  /* ── VOIX : micro + lecture à voix haute ── */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false, voiceOn = false, speaking = false, muted = false, callOpen = false, callT0 = 0, callTimer = null, wake = null;
  const micBtn = document.getElementById("mic-btn");
  if (!SR) micBtn.style.display = "none";

  function startMic() {
    if (!SR || listening || loading || muted) return;
    stopTalk();
    rec = new SR(); rec.lang = "fr-FR"; rec.interimResults = true; rec.continuous = false;
    let heard = false, finalTxt = "";
    rec.onstart = () => { listening = true; micBtn.classList.add("live"); inputEl.placeholder = "Je vous écoute…"; };
    rec.onresult = e => {
      let tmp = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) finalTxt += r[0].transcript; else tmp += r[0].transcript;
      }
      heard = true;
      inputEl.value = (finalTxt + tmp).trim(); autoResize(inputEl);
      sendBtn.disabled = !inputEl.value.trim() && !pending;
    };
    rec.onerror = e => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        voiceOn = false; syncVoice();
        addError("Accès au micro refusé. Autorisez-le dans les réglages du navigateur.");
      }
    };
    rec.onend = () => {
      listening = false; micBtn.classList.remove("live");
      inputEl.placeholder = ph();
      if (heard && inputEl.value.trim()) sendMessage();
      else if (voiceOn && !loading && !speaking) setTimeout(startMic, 400);
    };
    try { rec.start(); } catch (e) {}
  }
  function stopMic() { if (rec && listening) { try { rec.stop(); } catch (e) {} } }
  function toggleMic() {
    if (listening) { voiceOn = false; syncVoice(); stopMic(); } else startMic();
  }
  function syncVoice() {
    const b = document.getElementById("voice-toggle");
    b.classList.toggle("on", voiceOn); b.setAttribute("aria-pressed", voiceOn);
  }
  function toggleVoice() {
    voiceOn = !voiceOn; syncVoice();
    if (voiceOn) startMic(); else { stopTalk(); stopMic(); }
  }
  function speakBrowser(text) {
    if (!voiceOn) return;
    if (!window.speechSynthesis) { setTimeout(startMic, 300); return; }
    const clean = text.replace(/[*#`_>~|]/g, "").replace(/\p{Extended_Pictographic}/gu, "").replace(/\s+/g, " ").trim();
    if (!clean) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = "fr-FR"; u.rate = 1.02; u.pitch = P().pitch || 1;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("fr"));
    if (v) u.voice = v;
    u.onstart = () => { speaking = true; };
    u.onend = u.onerror = () => { speaking = false; if (voiceOn) setTimeout(startMic, 300); };
    speechSynthesis.speak(u);
  }
  /* ── APPEL VOCAL ── */
  const CALL_RULE = "MODE APPEL VOCAL : tu parles au téléphone avec l'utilisateur. Réponds en 1 à 3 phrases courtes, avec un ton oral et naturel. Aucun markdown, aucune liste, aucun emoji, aucun symbole. Pose au maximum une question à la fois.\n\n";
  function openCall() {
    if (!SR) { addError("Appel vocal indisponible sur ce navigateur. Utilisez Chrome (Android) ou Safari récent."); return; }
    callOpen = true; muted = false; callT0 = Date.now();
    const lg = document.querySelector(".logo"), av = document.getElementById("call-av");
    av.innerHTML = lg.innerHTML; av.style.background = lg.style.background || "";
    document.getElementById("call-name").textContent = personaId === "lare" ? "LARE" : P().name;
    document.getElementById("call-mute").classList.remove("on");
    document.getElementById("mute-slash").style.display = "none";
    document.getElementById("call").hidden = false;
    document.getElementById("call-voice").value = userVoice;
    stopTalk(); voiceOn = true; syncVoice();
    try { if (navigator.wakeLock) navigator.wakeLock.request("screen").then(w => { wake = w; }).catch(() => {}); } catch (e) {}
    callTick(); callTimer = setInterval(callTick, 250);
    startMic();
  }
  function endCall() {
    callOpen = false; voiceOn = false; muted = false; syncVoice(); stopTalk(); stopMic();
    clearInterval(callTimer); document.getElementById("call").hidden = true;
    inputEl.value = ""; autoResize(inputEl);
    try { if (wake) wake.release(); } catch (e) {} wake = null;
  }
  function toggleMute() {
    muted = !muted;
    document.getElementById("call-mute").classList.toggle("on", muted);
    document.getElementById("mute-slash").style.display = muted ? "" : "none";
    if (muted) stopMic(); else if (!speaking && !loading) startMic();
  }
  function interruptCall() { if (speaking) { stopTalk(); startMic(); } }
  function callTick() {
    const el = document.getElementById("call");
    const st = speaking ? "speak" : loading ? "think" : muted ? "mute" : listening ? "listen" : "idle";
    el.className = "st-" + st;
    const label = { speak: "Parle… (touchez pour interrompre)", think: "Réfléchit…", mute: "Micro coupé", listen: "Je vous écoute…", idle: "…" }[st];
    document.getElementById("call-status").textContent = label;
    const t = Math.floor((Date.now() - callT0) / 1000);
    document.getElementById("call-time").textContent = String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0");
    let live = "";
    if (st === "listen") live = inputEl.value;
    else if (st === "speak" || st === "idle" || st === "mute") { const m = history[history.length - 1]; if (m && m.role === "assistant") live = m.content; }
    document.getElementById("call-live").textContent = live.replace(/[*#`_]/g, "");
  }
  /* ── VOIX RÉALISTE (Gemini TTS via /api/tts) ── */
  const PERSONA_VOICE = { lare: "Charon", kossi: "Orus", edem: "Puck", afi: "Aoede", ama: "Kore" };
  let userVoice = load("lare_voice", "Charon");
  let audioEl = null, ttsGen = 0;
  function curVoice() { return userVoice === "browser" ? "browser" : (personaId === "lare" ? userVoice : (PERSONA_VOICE[personaId] || "Charon")); }
  function setVoice(v) { userVoice = v; try { localStorage.setItem("lare_voice", JSON.stringify(v)); } catch (e) {} stopTalk(); }
  function cleanTxt(t) { return t.replace(/[*#`_>~|]/g, "").replace(/\p{Extended_Pictographic}/gu, "").replace(/\s+/g, " ").trim(); }
  function splitChunks(t) {
    const parts = t.match(/[^.!?…\n]+[.!?…]*\s*/g) || [t], out = []; let cur = "";
    for (const p of parts) {
      const lim = out.length === 0 ? 180 : 350;
      if (cur && (cur + p).length > lim) { out.push(cur.trim()); cur = p; } else cur += p;
    }
    if (cur.trim()) out.push(cur.trim());
    return out.slice(0, 6);
  }
  async function fetchTts(t) {
    const r = await fetch("/api/tts", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: t, voice: curVoice() }) });
    if (!r.ok) throw new Error("tts " + r.status);
    const d = await r.json();
    return "data:audio/wav;base64," + d.audio;
  }
  function playUrl(url) {
    return new Promise(res => {
      const a = new Audio(url); audioEl = a;
      a.onended = a.onerror = () => res();
      a.play().catch(() => res());
    });
  }
  async function speakNeural(text) {
    const clean = cleanTxt(text);
    if (!clean) { if (voiceOn) setTimeout(startMic, 300); return; }
    const gen = ++ttsGen, chunks = splitChunks(clean);
    speaking = true;
    let next = fetchTts(chunks[0]); next.catch(() => {});
    for (let i = 0; i < chunks.length; i++) {
      let url;
      try { url = await next; } catch (e) {
        if (gen !== ttsGen) return;
        console.error("TTS", e); speaking = false; speakBrowser(chunks.slice(i).join(" ")); return;
      }
      if (gen !== ttsGen) return;
      if (i + 1 < chunks.length) { next = fetchTts(chunks[i + 1]); next.catch(() => {}); }
      await playUrl(url);
      if (gen !== ttsGen) return;
    }
    speaking = false; if (voiceOn) setTimeout(startMic, 300);
  }
  function speak(text) {
    if (!voiceOn) return;
    if (curVoice() === "browser") speakBrowser(text); else speakNeural(text);
  }
  function stopTalk() {
    ttsGen++; if (audioEl) { try { audioEl.pause(); } catch (e) {} audioEl = null; } speaking = false; if (window.speechSynthesis) speechSynthesis.cancel(); }

  /* ── INTERLOCUTEURS ── */
  function P() { return PERSONAS[personaId] || PERSONAS.lare; }
  function ph() { return personaId === "lare" ? "Posez votre question à LARE..." : "Écris à " + P().name + "…"; }
  function baseSystem() {
    const p = P();
    if (!p.prompt) return SYSTEM;
    return p.prompt + " Tu es un personnage fictif généré par IA, nommé " + p.name + ". Parle comme une vraie personne : ton naturel, phrases courtes, sans listes, titres ni markdown, sans formules d'assistant. Si on te demande sincèrement si tu es humain ou une IA, réponds honnêtement que tu es une IA. Ne cherche jamais à remplacer les relations réelles de l'utilisateur. Réponds en français sauf si l'utilisateur écrit dans une autre langue.";
  }
  function skin(av) {
    if (personaId === "lare") return;
    av.style.background = `linear-gradient(135deg,${P().c})`;
    av.innerHTML = `<span class="ini">${P().name[0]}</span>`;
  }
  function applyPersona() {
    const p = P(), lg = document.querySelector(".logo"), l = personaId === "lare";
    if (!lg.dataset.svg) lg.dataset.svg = lg.innerHTML;
    document.getElementById("who-name").innerHTML = l ? "LARE <em>Agent</em>" : p.name;
    document.getElementById("who-status").textContent = l ? "Agent IA actif · par Casimir KANWORE" : p.role + " · personnage IA";
    lg.style.background = l ? "" : `linear-gradient(135deg,${p.c})`;
    lg.innerHTML = l ? lg.dataset.svg : `<span class="ini">${p.name[0]}</span>`;
    inputEl.placeholder = ph();
  }
  function renderPersonas() {
    const el = document.getElementById("persona-list"); el.innerHTML = "";
    Object.entries(PERSONAS).forEach(([id, p]) => {
      const b = document.createElement("button");
      b.className = "pcard" + (id === personaId ? " active" : "");
      b.innerHTML = `<span class="pav" style="background:linear-gradient(135deg,${p.c})">${p.name[0]}</span><span><span class="pn">${p.name}</span><span class="pr">${p.role}</span></span>`;
      b.onclick = () => choosePersona(id);
      el.appendChild(b);
    });
  }
  function togglePersonas(open) {
    if (open) { toggleDrawer(false); renderPersonas(); }
    document.getElementById("personas").classList.toggle("open", open);
    document.getElementById("overlay").classList.toggle("open", open);
  }
  function choosePersona(id) {
    stopTalk(); personaId = id; applyPersona(); togglePersonas(false); newChat();
  }

  function init() {
    syncVoice();
    const c = convs.find(x => x.id === curId);
    if (c) personaId = c.persona || "lare";
    applyPersona();
    if (c && c.messages.length) { history = c.messages; history.forEach(m => addMessage(m.role, m.content, m.t)); }
    else addMessage("assistant", P().greet || `Bonjour! Je suis ${AGENT}, votre agent IA personnel. Comment puis-je vous aider aujourd'hui? 🤖✨`);
  }

  async function askLare(att) {
    const turns = history.slice(-20).map(({ role, content }) => ({ role, content }));
    while (turns.length && turns[0].role !== "user") turns.shift();
    const nm = P().name;
    const system = (callOpen ? CALL_RULE : "") + buildSystem() + "\n\nIdentité : tu es " + nm + ". Présente-toi uniquement sous ce nom. LARE a été créé par Casimir KANWORE : dis-le si on te demande qui t'a créé. Si on te demande quel modèle d'IA ou quelle entreprise te fait fonctionner, réponds que tu ne détailles pas ta technologie, sans rien affirmer de faux. Si on te demande sincèrement si tu es humain, dis que tu es une IA.";
    turns[turns.length - 1].content += "\n\n(Rappel : réponds en tant que " + nm + ", sous ce nom.)";
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: turns, system, attachment: att ? { name: att.name, mime: att.mime, data: att.data, text: att.text } : null })
    });
    if (res.status === 429) {
      let d = {}; try { d = await res.json(); } catch (e) {}
      console.error("LARE 429", d); throw { code: d.error === "daily_limit" ? "daily_limit" : "rate_limited", detail: d.detail };
    }
    if (!res.ok) {
      let d = {}; try { d = await res.json(); } catch (e) {}
      console.error("LARE /api/chat", res.status, d);
      throw new Error(d.detail || ("erreur " + res.status));
    }
    const data = await res.json();
    return data.reply;
  }

  function now() {
    return new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  }

  function autoResize(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 110) + "px";
  }

  let pending = null;
  const MAX_PDF = 3.5 * 1024 * 1024;
  function toB64(f) {
    return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = () => rej(new Error("Lecture du fichier impossible.")); r.readAsDataURL(f); });
  }
  function shrinkImage(f) {
    return new Promise((res, rej) => {
      const u = URL.createObjectURL(f), img = new Image();
      img.onload = () => {
        const k = Math.min(1, 1280 / Math.max(img.width, img.height));
        const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        const url = c.toDataURL("image/jpeg", 0.82); URL.revokeObjectURL(u);
        res({ url, b64: url.split(",")[1] });
      };
      img.onerror = () => { URL.revokeObjectURL(u); rej(new Error("Image illisible.")); };
      img.src = u;
    });
  }
  async function pickFile(e) {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    try {
      if (f.type.startsWith("image/")) {
        const d = await shrinkImage(f);
        pending = { kind: "image", name: f.name || "photo.jpg", mime: "image/jpeg", data: d.b64, preview: d.url };
      } else if (f.type === "application/pdf") {
        if (f.size > MAX_PDF) throw new Error("PDF trop lourd (max 3,5 Mo).");
        pending = { kind: "pdf", name: f.name, mime: "application/pdf", data: await toB64(f) };
      } else if (f.type.startsWith("text/") || /\.(txt|md|csv|json)$/i.test(f.name)) {
        if (f.size > 200 * 1024) throw new Error("Fichier texte trop long (max 200 Ko).");
        pending = { kind: "text", name: f.name, text: await f.text() };
      } else throw new Error("Format non pris en charge : photo, PDF ou fichier texte.");
      renderPending();
    } catch (err) { addError(err.message); }
  }
  function renderPending() {
    const el = document.getElementById("att-preview");
    if (!pending) { el.hidden = true; el.innerHTML = ""; sendBtn.disabled = !inputEl.value.trim() || loading; return; }
    el.hidden = false;
    el.innerHTML = (pending.preview ? `<img src="${pending.preview}" alt="">` : "<span>📎</span>") + `<span class="nm"></span><button onclick="pending=null;renderPending()" aria-label="Retirer">✕</button>`;
    el.querySelector(".nm").textContent = pending.name;
    sendBtn.disabled = loading;
  }

  function handleKey(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function useSuggestion(btn) {
    inputEl.value = btn.textContent;
    autoResize(inputEl);
    sendBtn.disabled = false;
    sendMessage();
  }

  function addMessage(role, text, time, att) {
    const isUser = role === "user";
    const row = document.createElement("div");
    row.className = `row ${isUser ? "user" : "lare"}`;

    const avatar = document.createElement("div");
    avatar.className = `avatar ${isUser ? "user" : "lare"}`;
    avatar.innerHTML = isUser
      ? `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" fill="#e2e8f0"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" fill="#e2e8f0"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="url(#g)"/><defs><radialGradient id="g" cx="30%" cy="30%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#7c3aed"/></radialGradient></defs><path d="M8 12h8M12 8v8" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>`;

    const bubble = document.createElement("div");
    bubble.className = `bubble ${isUser ? "user" : "lare"}`;
    const attHtml = att ? (att.preview ? `<img class="att-img" src="${att.preview}" alt="">` : `<div class="att-file">📎 ${escHtml(att.name)}</div>`) : "";
    bubble.innerHTML = `${attHtml}<div style="white-space:pre-wrap">${fmt(text)}</div><div class="bubble-time">${time || now()}</div>`;

    row.appendChild(avatar);
    if (!isUser) skin(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollBottom();
  }

  function addTyping() {
    const row = document.createElement("div");
    row.className = "row lare";
    row.id = "typing-row";

    const avatar = document.createElement("div");
    avatar.className = "avatar lare";
    avatar.innerHTML = `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="url(#g2)"/><defs><radialGradient id="g2" cx="30%" cy="30%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#7c3aed"/></radialGradient></defs><path d="M8 12h8M12 8v8" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>`;

    const dots = document.createElement("div");
    dots.className = "typing-dots";
    dots.innerHTML = "<span></span><span></span><span></span>";

    row.appendChild(avatar);
    skin(avatar);
    row.appendChild(dots);
    messagesEl.appendChild(row);
    scrollBottom();
  }

  function removeTyping() {
    const el = document.getElementById("typing-row");
    if (el) el.remove();
  }

  function addError(msg) {
    const div = document.createElement("div");
    div.className = "error-msg";
    div.textContent = "⚠️ " + msg;
    messagesEl.appendChild(div);
    scrollBottom();
  }

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function fmt(t) {
    return escHtml(t).replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>").replace(/`([^`\n]+)`/g, "<code>$1</code>");
  }
  function escHtml(t) {
    return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  async function sendMessage() {
    const typed = inputEl.value.trim();
    if ((!typed && !pending) || loading) return;
    const att = pending; pending = null; renderPending();
    const text = typed || (att ? (att.kind === "image" ? "Regarde cette image et dis-moi ce que tu y vois." : "Lis ce document et fais-m'en un résumé.") : "");

    loading = true;
    sendBtn.disabled = true;
    inputEl.value = "";
    inputEl.style.height = "auto";

    addMessage("user", text, null, att);
    history.push({ role: "user", content: text + (att ? "\n[📎 fichier joint : " + att.name + "]" : ""), t: now() }); save(); stopMic();
    addTyping();

    try {
      const reply = (await askLare(att)) || "Désolé, aucune réponse générée.";

      removeTyping();
      addMessage("assistant", reply);
      history.push({ role: "assistant", content: reply, t: now() }); save(); speak(reply);

    } catch (err) {
      removeTyping();
      if (voiceOn && !speaking) setTimeout(startMic, 1500);
      if (att) { pending = att; renderPending(); }
      history.pop(); convs = convs.filter(c => c.messages.length); persist();
      addError(err && err.code === "not_granted" ? "Autorisation refusée : acceptez la demande d'autorisation pour discuter avec LARE." : err && err.code === "daily_limit" ? "Vous avez atteint la limite de messages pour aujourd'hui. Revenez demain !" : err && err.code === "rate_limited" ? "Limite Gemini atteinte sur tous les modèles, patientez 1 minute puis réessayez." + (err.detail ? " [" + err.detail + "]" : "") : "LARE ne répond pas : " + ((err && err.message) || "réessayez dans un instant."));
    } finally {
      loading = false;
      sendBtn.disabled = !inputEl.value.trim() && !pending;
      if (!callOpen) inputEl.focus();
    }
  }

  init();
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
</script>
</body>
</html>
